<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 — Calendario</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #ececea;
    --text: #1a1a18; --text2: #6b6b68; --text3: #9a9a97;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.2);
    --info-bg: #e6f1fb; --info-text: #185fa5; --info-border: #b5d4f4;
    --success-bg: #eaf3de; --success-text: #3b6d11; --success-border: #c0dd97;
    --danger-bg: #fcebeb; --danger-text: #a32d2d; --danger-border: #f7c1c1;
    --warn-bg: #faeeda; --warn-text: #854f0b;
    --radius: 8px; --radius-lg: 12px;
    --gold: #d4a017;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c; --bg2: #2a2a28; --bg3: #333331;
      --text: #f0ede8; --text2: #a8a8a5; --text3: #6b6b68;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --info-bg: #0c447c; --info-text: #b5d4f4; --info-border: #185fa5;
      --success-bg: #27500a; --success-text: #c0dd97; --success-border: #3b6d11;
      --danger-bg: #791f1f; --danger-text: #f7c1c1; --danger-border: #a32d2d;
      --warn-bg: #633806; --warn-text: #fac775;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
  
  /* Header */
  .header { padding: 1rem 1rem 0.5rem; border-bottom: 0.5px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .title-main { font-size: 18px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .lang-btn { font-size: 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 5px 12px; background: transparent; color: var(--text2); cursor: pointer; transition: background 0.15s; }
  .lang-btn:hover { background: var(--bg2); }
  .filter-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .filter-row { display: flex; gap: 6px; padding: 6px 0 2px; width: max-content; min-width: 100%; }
  .filter-btn { font-size: 12px; padding: 5px 12px; border: 0.5px solid var(--border); border-radius: 20px; background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn.active { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); }

  /* Status */
  .status-bar { font-size: 11px; color: var(--text3); padding: 5px 1rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 6px; background: var(--bg); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success-bg); border: 1.5px solid var(--success-text); display: inline-block; flex-shrink: 0; }
  .dot.loading { background: var(--warn-bg); border-color: var(--warn-text); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* Matches */
  .matches-list { padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 10px; }
  .date-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-top: 4px; padding: 2px 0; letter-spacing: 0.02em; }
  .match-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }
  .match-meta { font-size: 11px; color: var(--text3); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .match-phase { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 500; }
  .phase-group { background: var(--info-bg); color: var(--info-text); border: 0.5px solid var(--info-border); }
  .phase-live { background: var(--danger-bg); color: var(--danger-text); border: 0.5px solid var(--danger-border); animation: pulse 1.5s infinite; }
  .phase-ft { background: var(--success-bg); color: var(--success-text); border: 0.5px solid var(--success-border); }
  
  .match-teams { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .team { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
  .team.away { flex-direction: row-reverse; }
  .flag { font-size: 22px; line-height: 1; flex-shrink: 0; }
  .team-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team.away .team-name { text-align: right; }
  
  .score-box { display: flex; align-items: center; gap: 4px; flex-shrink: 0; background: var(--bg2); border-radius: var(--radius); padding: 4px 10px; }
  .score { font-size: 22px; font-weight: 500; color: var(--text); min-width: 22px; text-align: center; }
  .score-sep { font-size: 14px; color: var(--text3); }
  
  .venue-info { font-size: 11px; color: var(--text3); margin-top: 8px; display: flex; align-items: center; gap: 4px; }
  
  .edit-btn { font-size: 11px; background: transparent; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 10px; color: var(--text2); cursor: pointer; margin-top: 8px; transition: background 0.15s; display: flex; align-items: center; gap: 4px; }
  .edit-btn:hover { background: var(--bg2); }
  
  .edit-form { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); display: none; }
  .edit-form.open { display: block; }
  .edit-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
  .edit-inputs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .edit-inputs input { width: 50px; padding: 6px 8px; text-align: center; font-size: 16px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); -webkit-appearance: none; }
  .edit-team { font-size: 12px; color: var(--text2); }
  .save-btn { font-size: 12px; padding: 6px 14px; border: 0.5px solid var(--info-border); border-radius: var(--radius); background: var(--info-bg); color: var(--info-text); cursor: pointer; font-weight: 500; }
  .clear-btn { font-size: 12px; padding: 6px 10px; border: 0.5px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text3); cursor: pointer; }

  .empty-msg { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
  
  /* Footer */
  .footer { padding: 1rem; text-align: center; font-size: 11px; color: var(--text3); border-top: 0.5px solid var(--border); margin-top: 1rem; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-row">
      <span class="title-main">
        <i class="ti ti-trophy" style="font-size:20px;color:#d4a017" aria-hidden="true"></i>
        <span id="app-title">Mundial 2026</span>
      </span>
      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </div>
    <div class="filter-scroll">
      <div class="filter-row" id="filter-row"></div>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot loading" id="status-dot"></span>
    <span id="status-text">Cargando datos en vivo...</span>
  </div>

  <div class="matches-list" id="matches-list">
    <div class="empty-msg">Cargando partidos...</div>
  </div>

  <div class="footer">
    Mundial 2026 · Datos vía wc2026api.com · Horarios en hora CDMX
  </div>
</div>

<script>
const TEAMS = {
  MEX: { flag: "🇲🇽", es: "México", en: "Mexico" },
  BRA: { flag: "🇧🇷", es: "Brasil", en: "Brazil" },
  ESP: { flag: "🇪🇸", es: "España", en: "Spain" },
  COL: { flag: "🇨🇴", es: "Colombia", en: "Colombia" },
  POR: { flag: "🇵🇹", es: "Portugal", en: "Portugal" },
  FRA: { flag: "🇫🇷", es: "Francia", en: "France" },
  GER: { flag: "🇩🇪", es: "Alemania", en: "Germany" },
  NED: { flag: "🇳🇱", es: "Países Bajos", en: "Netherlands" },
  ENG: { flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", es: "Inglaterra", en: "England" }
};

const FEATURED = Object.keys(TEAMS);

const MATCHES = [
  { id:"mex1", home:"MEX", away:"RSA", homeFlag:"🇲🇽", awayFlag:"🇿🇦", date:"2026-06-11", time:"13:00", stadium:"Estadio Azteca", city:"Ciudad de México", group:"A", featured:"MEX" },
  { id:"mex2", home:"MEX", away:"KOR", homeFlag:"🇲🇽", awayFlag:"🇰🇷", date:"2026-06-18", time:"21:00", stadium:"Estadio Akron", city:"Zapopan", group:"A", featured:"MEX" },
  { id:"mex3", home:"CZE", away:"MEX", homeFlag:"🇨🇿", awayFlag:"🇲🇽", date:"2026-06-24", time:"19:00", stadium:"Estadio Azteca", city:"Ciudad de México", group:"A", featured:"MEX" },
  { id:"bra1", home:"BRA", away:"MAR", homeFlag:"🇧🇷", awayFlag:"🇲🇦", date:"2026-06-13", time:"18:00", stadium:"MetLife Stadium", city:"East Rutherford, NJ", group:"C", featured:"BRA" },
  { id:"bra2", home:"BRA", away:"HAI", homeFlag:"🇧🇷", awayFlag:"🇭🇹", date:"2026-06-19", time:"21:00", stadium:"Lincoln Financial Field", city:"Filadelfia", group:"C", featured:"BRA" },
  { id:"bra3", home:"SCO", away:"BRA", homeFlag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", awayFlag:"🇧🇷", date:"2026-06-24", time:"18:00", stadium:"Hard Rock Stadium", city:"Miami", group:"C", featured:"BRA" },
  { id:"esp1", home:"ESP", away:"KSA", homeFlag:"🇪🇸", awayFlag:"🇸🇦", date:"2026-06-14", time:"17:00", stadium:"Mercedes-Benz Stadium", city:"Atlanta", group:"H", featured:"ESP" },
  { id:"esp2", home:"URU", away:"ESP", homeFlag:"🇺🇾", awayFlag:"🇪🇸", date:"2026-06-21", time:"18:00", stadium:"Hard Rock Stadium", city:"Miami", group:"H", featured:"ESP" },
  { id:"esp3", home:"ESP", away:"CPV", homeFlag:"🇪🇸", awayFlag:"🇨🇻", date:"2026-06-26", time:"18:00", stadium:"SoFi Stadium", city:"Los Ángeles", group:"H", featured:"ESP" },
  { id:"col1", home:"UZB", away:"COL", homeFlag:"🇺🇿", awayFlag:"🇨🇴", date:"2026-06-17", time:"22:00", stadium:"Estadio Azteca", city:"Ciudad de México", group:"K", featured:"COL" },
  { id:"col2", home:"COL", away:"CGO", homeFlag:"🇨🇴", awayFlag:"🇨🇩", date:"2026-06-23", time:"22:00", stadium:"Estadio Akron", city:"Zapopan", group:"K", featured:"COL" },
  { id:"col3", home:"COL", away:"POR", homeFlag:"🇨🇴", awayFlag:"🇵🇹", date:"2026-06-27", time:"19:30", stadium:"Hard Rock Stadium", city:"Miami", group:"K", featured:"COL" },
  { id:"por1", home:"POR", away:"CGO", homeFlag:"🇵🇹", awayFlag:"🇨🇩", date:"2026-06-17", time:"13:00", stadium:"NRG Stadium", city:"Houston", group:"K", featured:"POR" },
  { id:"por2", home:"POR", away:"UZB", homeFlag:"🇵🇹", awayFlag:"🇺🇿", date:"2026-06-23", time:"13:00", stadium:"NRG Stadium", city:"Houston", group:"K", featured:"POR" },
  { id:"fre1", home:"FRA", away:"SEN", homeFlag:"🇫🇷", awayFlag:"🇸🇳", date:"2026-06-13", time:"15:00", stadium:"MetLife Stadium", city:"East Rutherford, NJ", group:"I", featured:"FRA" },
  { id:"fre2", home:"NOR", away:"FRA", homeFlag:"🇳🇴", awayFlag:"🇫🇷", date:"2026-06-20", time:"18:00", stadium:"AT&T Stadium", city:"Dallas", group:"I", featured:"FRA" },
  { id:"fre3", home:"FRA", away:"IRQ", homeFlag:"🇫🇷", awayFlag:"🇮🇶", date:"2026-06-25", time:"21:00", stadium:"MetLife Stadium", city:"East Rutherford, NJ", group:"I", featured:"FRA" },
  { id:"ger1", home:"GER", away:"CUW", homeFlag:"🇩🇪", awayFlag:"🇨🇼", date:"2026-06-14", time:"18:00", stadium:"NRG Stadium", city:"Houston", group:"E", featured:"GER" },
  { id:"ger2", home:"GER", away:"CIV", homeFlag:"🇩🇪", awayFlag:"🇨🇮", date:"2026-06-20", time:"18:00", stadium:"BMO Field", city:"Toronto", group:"E", featured:"GER" },
  { id:"ger3", home:"ECU", away:"GER", homeFlag:"🇪🇨", awayFlag:"🇩🇪", date:"2026-06-25", time:"16:00", stadium:"MetLife Stadium", city:"East Rutherford, NJ", group:"E", featured:"GER" },
  { id:"ned1", home:"NED", away:"JPN", homeFlag:"🇳🇱", awayFlag:"🇯🇵", date:"2026-06-14", time:"21:00", stadium:"AT&T Stadium", city:"Arlington, TX", group:"F", featured:"NED" },
  { id:"ned2", home:"NED", away:"SWE", homeFlag:"🇳🇱", awayFlag:"🇸🇪", date:"2026-06-20", time:"21:00", stadium:"NRG Stadium", city:"Houston", group:"F", featured:"NED" },
  { id:"ned3", home:"TUN", away:"NED", homeFlag:"🇹🇳", awayFlag:"🇳🇱", date:"2026-06-25", time:"21:00", stadium:"GEHA Field", city:"Kansas City", group:"F", featured:"NED" },
  { id:"eng1", home:"ENG", away:"CRO", homeFlag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", awayFlag:"🇭🇷", date:"2026-06-17", time:"16:00", stadium:"AT&T Stadium", city:"Arlington, TX", group:"L", featured:"ENG" },
  { id:"eng2", home:"ENG", away:"GHA", homeFlag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", awayFlag:"🇬🇭", date:"2026-06-23", time:"16:00", stadium:"Gillette Stadium", city:"Boston", group:"L", featured:"ENG" },
  { id:"eng3", home:"PAN", away:"ENG", homeFlag:"🇵🇦", awayFlag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", date:"2026-06-27", time:"17:00", stadium:"MetLife Stadium", city:"East Rutherford, NJ", group:"L", featured:"ENG" }
];

let lang = "es";
let activeFilter = "ALL";
let liveScores = {};
let manualScores = {};

const T = {
  title:     { es: "Mundial 2026",              en: "World Cup 2026" },
  all:       { es: "Todos",                     en: "All" },
  loading:   { es: "Cargando datos en vivo...", en: "Loading live data..." },
  live:      { es: "EN VIVO",                   en: "LIVE" },
  scheduled: { es: "Programado",                en: "Scheduled" },
  finished:  { es: "Finalizado",                en: "Finished" },
  group:     { es: "Grupo",                     en: "Group" },
  edit:      { es: "Editar marcador",           en: "Edit score" },
  save:      { es: "Guardar",                   en: "Save" },
  clear:     { es: "Borrar",                    en: "Clear" },
  updated:   { es: "Actualizado",               en: "Updated" },
  error:     { es: "Datos locales",             en: "Local data" },
  cdmx:      { es: "hora CDMX",                 en: "CDMX time" },
  score:     { es: "Marcador:",                 en: "Score:" }
};

function t(k) { return T[k]?.[lang] || k; }

function formatDate(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString(lang === "es" ? "es-MX" : "en-US", { weekday: "long", day: "numeric", month: "long" });
}

function toggleLang() {
  lang = lang === "es" ? "en" : "es";
  document.getElementById("lang-toggle").textContent = lang === "es" ? "EN" : "ES";
  document.getElementById("app-title").textContent = t("title");
  document.querySelector(".footer").innerHTML = lang === "es"
    ? "Mundial 2026 · Datos vía wc2026api.com · Horarios en hora CDMX"
    : "World Cup 2026 · Data via wc2026api.com · Times in CDMX timezone";
  renderFilters();
  renderMatches();
}

function renderFilters() {
  const row = document.getElementById("filter-row");
  const filters = [{ code:"ALL", label: t("all"), flag:"" },
    ...FEATURED.map(k => ({ code:k, label: TEAMS[k][lang], flag: TEAMS[k].flag }))];
  row.innerHTML = filters.map(f =>
    `<button class="filter-btn ${activeFilter===f.code?"active":""}" onclick="setFilter('${f.code}')">` +
    (f.flag ? f.flag + " " : "") + f.label + `</button>`
  ).join("");
}

function setFilter(code) {
  activeFilter = code;
  renderFilters();
  renderMatches();
}

function getPhase(m) {
  const sc = liveScores[m.id];
  if (sc) {
    const s = sc.status || "";
    if (["live","1H","2H","HT","ET1","ET2","PEN"].includes(s)) return "live";
    if (["FT","FT_PEN","finished"].includes(s)) return "ft";
  }
  const now = new Date();
  const matchDt = new Date(m.date + "T" + m.time + ":00-06:00");
  if (now > new Date(matchDt.getTime() + 2*60*60*1000)) return "ft";
  if (now > matchDt) return "live";
  return "scheduled";
}

function getScore(m) {
  if (manualScores[m.id] !== undefined) return manualScores[m.id];
  const sc = liveScores[m.id];
  if (sc && sc.home_score !== undefined && sc.home_score !== null) return { home: sc.home_score, away: sc.away_score };
  return null;
}

function toggleEdit(id) {
  const form = document.getElementById("ef-" + id);
  if (!form) return;
  const isOpen = form.classList.contains("open");
  document.querySelectorAll(".edit-form.open").forEach(f => f.classList.remove("open"));
  if (!isOpen) { form.classList.add("open"); }
}

function saveScore(id) {
  const h = document.getElementById("hi-" + id);
  const a = document.getElementById("ai-" + id);
  if (!h || !a || h.value === "" || a.value === "") return;
  manualScores[id] = { home: parseInt(h.value), away: parseInt(a.value) };
  document.getElementById("ef-" + id).classList.remove("open");
  renderMatches();
}

function clearScore(id) {
  delete manualScores[id];
  document.getElementById("ef-" + id).classList.remove("open");
  renderMatches();
}

function renderMatches() {
  const list = document.getElementById("matches-list");
  let filtered = activeFilter === "ALL" ? MATCHES : MATCHES.filter(m => m.featured === activeFilter);
  filtered = [...filtered].sort((a,b) => new Date(a.date+"T"+a.time) - new Date(b.date+"T"+b.time));

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-msg">No hay partidos para mostrar.</div>`;
    return;
  }

  let html = "";
  let lastDate = "";

  filtered.forEach(m => {
    if (m.date !== lastDate) {
      html += `<div class="date-label">${formatDate(m.date)}</div>`;
      lastDate = m.date;
    }

    const phase = getPhase(m);
    const score = getScore(m);
    const homeName = TEAMS[m.home]?.[lang] || m.home;
    const awayName = TEAMS[m.away]?.[lang] || m.away;
    const phaseClass = phase === "live" ? "phase-live" : phase === "ft" ? "phase-ft" : "phase-group";
    const phaseLabel = phase === "live" ? t("live") : phase === "ft" ? t("finished") : `${t("group")} ${m.group}`;
    const curScore = getScore(m);

    html += `
    <div class="match-card">
      <div class="match-meta">
        <span>${m.time} ${t("cdmx")}</span>
        <span class="match-phase ${phaseClass}">${phaseLabel}</span>
      </div>
      <div class="match-teams">
        <div class="team home">
          <span class="flag" aria-hidden="true">${m.homeFlag}</span>
          <span class="team-name">${homeName}</span>
        </div>
        <div class="score-box">
          <span class="score">${score !== null ? score.home : "–"}</span>
          <span class="score-sep">:</span>
          <span class="score">${score !== null ? score.away : "–"}</span>
        </div>
        <div class="team away">
          <span class="flag" aria-hidden="true">${m.awayFlag}</span>
          <span class="team-name">${awayName}</span>
        </div>
      </div>
      <div class="venue-info">
        <i class="ti ti-map-pin" aria-hidden="true" style="font-size:12px"></i>
        ${m.stadium} · ${m.city}
      </div>
      <button class="edit-btn" onclick="toggleEdit('${m.id}')">
        <i class="ti ti-pencil" aria-hidden="true" style="font-size:12px"></i> ${t("edit")}
      </button>
      <div class="edit-form" id="ef-${m.id}">
        <div class="edit-label">${t("score")} ${homeName} vs ${awayName}</div>
        <div class="edit-inputs">
          <span class="edit-team">${m.homeFlag}</span>
          <input type="number" id="hi-${m.id}" min="0" max="20" value="${curScore ? curScore.home : 0}" />
          <span style="font-size:16px;color:var(--text3)">–</span>
          <input type="number" id="ai-${m.id}" min="0" max="20" value="${curScore ? curScore.away : 0}" />
          <span class="edit-team">${m.awayFlag}</span>
          <button class="save-btn" onclick="saveScore('${m.id}')">${t("save")}</button>
          <button class="clear-btn" onclick="clearScore('${m.id}')">${t("clear")}</button>
        </div>
      </div>
    </div>`;
  });

  list.innerHTML = html;
}

async function fetchLiveScores() {
  const dot = document.getElementById("status-dot");
  const statusTxt = document.getElementById("status-text");
  dot.className = "dot loading";
  statusTxt.textContent = t("loading");

  const teamNames = ["Mexico","Brazil","Spain","Colombia","Portugal","France","Germany","Netherlands","England"];
  const featuredCodes = ["MEX","BRA","ESP","COL","POR","FRA","GER","NED","ENG"];

  try {
    const promises = teamNames.map(team =>
      fetch(`https://api.wc2026api.com/matches?team=${encodeURIComponent(team)}`, {
        headers: { "Authorization": "Bearer wc2026_demo" }
      }).then(r => r.ok ? r.json() : null).catch(() => null)
    );

    const results = await Promise.allSettled(promises);
    let gotData = false;

    results.forEach((r, idx) => {
      if (r.status === "fulfilled" && r.value) {
        const data = Array.isArray(r.value) ? r.value : (r.value.matches || []);
        const code = featuredCodes[idx];
        data.forEach(m => {
          if (!m) return;
          const matchKey = code.toLowerCase() + (data.indexOf(m) + 1);
          const knownIds = MATCHES.filter(km => km.featured === code).map(km => km.id);
          const matchIdx = data.indexOf(m);
          const localId = knownIds[matchIdx];
          if (localId) {
            liveScores[localId] = {
              status: m.status || m.phase || "scheduled",
              home_score: m.home_score ?? null,
              away_score: m.away_score ?? null
            };
            gotData = true;
          }
        });
      }
    });

    dot.className = "dot";
    const now = new Date().toLocaleTimeString(lang === "es" ? "es-MX" : "en-US", { hour:"2-digit", minute:"2-digit" });
    statusTxt.textContent = (gotData ? t("updated") : t("error")) + " · " + now;
  } catch(e) {
    dot.className = "dot";
    statusTxt.textContent = t("error");
  }

  renderMatches();
}

renderFilters();
renderMatches();
fetchLiveScores();
setInterval(fetchLiveScores, 60000);
</script>
</body>
</html>
