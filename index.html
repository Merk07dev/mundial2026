<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --deep:#07090f;--surf:#0f1520;--card:#131c2b;--card2:#172035;
  --gold:#f0b429;--gold2:#ffd770;
  --blue:#3b82f6;--blue2:#60a5fa;--blue3:#1d4ed8;
  --red:#ef4444;--red2:#fca5a5;
  --green:#22c55e;--green2:#86efac;
  --amber:#f59e0b;--amber2:#fcd34d;
  --text:#f1f5f9;--text2:#cbd5e1;--text3:#94a3b8;--text4:#64748b;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.16);
  --r:10px;--rl:16px
}
html{background:var(--deep)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--deep);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--deep);position:relative}

/* HEADER */
.hdr{background:linear-gradient(160deg,#0d1526 0%,#12173a 60%,#0d1526 100%);padding:20px 16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
.brand-text .name{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.brand-text .sub{font-size:11px;color:var(--text4);margin-top:1px}
.lang-btn{font-size:11px;font-weight:600;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,0.05);color:var(--text3);border:1px solid var(--border2);cursor:pointer;transition:all .15s}
.lang-btn:hover{background:rgba(255,255,255,0.08);color:var(--text2)}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--text4);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--blue2);border-bottom-color:var(--blue)}

/* TEAM FILTER (only on calendar tab) */
.fscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 10px}
.fscroll::-webkit-scrollbar{display:none}
.frow{display:flex;gap:7px;width:max-content}
.fpill{font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.04);color:var(--text3);border:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fpill:hover{background:rgba(255,255,255,0.07);color:var(--text2)}
.fpill.active{background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(59,130,246,0.35)}

/* STATUS BAR */
.sbar{display:flex;align-items:center;gap:7px;padding:6px 16px;background:rgba(0,0,0,0.3);font-size:11px;color:var(--text4);border-bottom:1px solid var(--border)}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sdot.ok{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.5)}
.sdot.loading{background:var(--amber);animation:blink 1s infinite}
.sdot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* PAGES */
.page{display:none;padding:12px 12px 80px}
.page.active{display:block}

/* MATCH CARD */
.dlabel{font-size:11px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.07em;padding:14px 4px 6px}
.dlabel:first-child{padding-top:6px}
.mcard{border-radius:var(--rl);overflow:hidden;background:var(--card);border:1px solid var(--border);margin-bottom:9px;position:relative}
.mcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 10%,rgba(255,255,255,0.09) 50%,transparent 90%);pointer-events:none}
.mcard.live{border-color:rgba(239,68,68,0.25);background:linear-gradient(160deg,#130d0d 0%,#1c1010 100%)}
.mcard.live::before{background:linear-gradient(90deg,transparent 10%,rgba(239,68,68,0.2) 50%,transparent 90%)}
.mcard.ft{opacity:.82}
.ch{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0}
.ch-time{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text4)}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.b-sched{background:rgba(59,130,246,0.1);color:var(--blue2);border:1px solid rgba(59,130,246,0.18)}
.b-live{background:rgba(239,68,68,0.12);color:var(--red2);border:1px solid rgba(239,68,68,0.22);animation:blink 1.8s infinite}
.b-ht{background:rgba(245,158,11,0.1);color:var(--amber2);border:1px solid rgba(245,158,11,0.2)}
.b-ft{background:rgba(34,197,94,0.08);color:var(--green2);border:1px solid rgba(34,197,94,0.18)}
.matchup{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 14px 12px}
.tcol{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tcol.away{flex-direction:row-reverse}
.tflag{font-size:26px;line-height:1;flex-shrink:0}
.tinfo{min-width:0}
.tname{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcode{font-size:10px;color:var(--text4);margin-top:2px}
.tcol.away .tinfo{text-align:right}
.tcol.away .tcode{text-align:right}
.scenter{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.sbox{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:var(--r);padding:6px 12px}
.sn{font-size:26px;font-weight:700;color:var(--text);min-width:20px;text-align:center;line-height:1}
.ssep{font-size:14px;color:var(--text4);margin:0 2px}
.smin{font-size:10px;font-weight:700;color:var(--red2);margin-top:3px;letter-spacing:.03em}
.cf{display:flex;align-items:center;justify-content:space-between;padding:7px 14px 9px;border-top:1px solid var(--border)}
.venue{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text4);flex:1;min-width:0}
.venue span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtns{display:flex;gap:5px;flex-shrink:0}
.cbtn{font-size:10px;font-weight:500;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text3);border:1px solid var(--border2);cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .15s;white-space:nowrap}
.cbtn:hover{background:rgba(255,255,255,0.08);color:var(--text2)}
.cbtn.on{background:rgba(59,130,246,0.12);color:var(--blue2);border-color:rgba(59,130,246,0.22)}
.epanel{background:rgba(0,0,0,0.3);border-top:1px solid var(--border)}
.ep-hdr{display:flex;align-items:center;gap:6px;padding:8px 14px 4px;font-size:11px;font-weight:600;color:var(--text3)}
.evrow{display:flex;align-items:flex-start;gap:8px;padding:4px 14px;font-size:12px}
.evrow:last-child{padding-bottom:10px}
.evmin{font-size:10px;font-weight:700;color:var(--text4);min-width:28px;text-align:right;padding-top:2px;flex-shrink:0}
.evico{font-size:14px;flex-shrink:0;line-height:1.4}
.evtxt{color:var(--text2);flex:1;line-height:1.4}
.evsub{font-size:10px;color:var(--text4);display:block;margin-top:1px}
.noev{font-size:12px;color:var(--text4);font-style:italic;padding:6px 14px 10px}

/* STANDINGS TAB */
.grp-block{margin-bottom:18px}
.grp-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:6px 4px 8px;display:flex;align-items:center;gap:6px}
.grp-title span{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--blue3),var(--blue));display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.standing-table{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.st-head{display:grid;grid-template-columns:24px 1fr 28px 28px 28px 28px 32px;gap:0;padding:7px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.05em}
.st-row{display:grid;grid-template-columns:24px 1fr 28px 28px 28px 28px 32px;gap:0;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s}
.st-row:last-child{border-bottom:none}
.st-row:hover{background:rgba(255,255,255,0.02)}
.st-row.qualify{border-left:2px solid var(--green)}
.st-row.maybe{border-left:2px solid var(--amber)}
.st-row.featured{background:rgba(59,130,246,0.06)}
.st-pos{font-size:12px;font-weight:600;color:var(--text4);text-align:center}
.st-team{display:flex;align-items:center;gap:7px;min-width:0}
.st-flag{font-size:16px;flex-shrink:0}
.st-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-num{font-size:12px;color:var(--text3);text-align:center}
.st-pts{font-size:12px;font-weight:700;color:var(--text);text-align:center}
.st-loading{padding:24px;text-align:center;font-size:12px;color:var(--text4)}

/* KNOCKOUT TAB */
.ko-section{margin-bottom:24px}
.ko-round-title{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;padding:16px 4px 8px;display:flex;align-items:center;gap:8px}
.ko-round-title::after{content:'';flex:1;height:1px;background:var(--border)}
.ko-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:8px;overflow:hidden;position:relative}
.ko-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 10%,rgba(255,255,255,0.07) 50%,transparent 90%);pointer-events:none}
.ko-card.live{border-color:rgba(239,68,68,0.25)}
.ko-card.tbd{opacity:.55}
.ko-meta{display:flex;align-items:center;justify-content:space-between;padding:8px 13px 0;font-size:10px;color:var(--text4)}
.ko-matchup{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 13px 10px}
.ko-team{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.ko-team.away{flex-direction:row-reverse}
.ko-flag{font-size:22px;flex-shrink:0}
.ko-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ko-team.away .ko-name{text-align:right}
.ko-sbox{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;flex-shrink:0}
.ko-sn{font-size:20px;font-weight:700;color:var(--text);min-width:18px;text-align:center;line-height:1}
.ko-sep{font-size:13px;color:var(--text4);margin:0 1px}
.ko-venue{padding:0 13px 9px;font-size:10px;color:var(--text4);display:flex;align-items:center;gap:4px}

.empty{text-align:center;padding:4rem 1rem;color:var(--text4);font-size:14px}
.footer{padding:1rem;text-align:center;font-size:11px;color:var(--text4);border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="app">

      <div class="tab" id="tab-ko" onclick="switchTab('ko')"><i class="ti ti-tournament" style="font-size:13px" aria-hidden="true"></i> <span id="tlbl-ko">Eliminatoria</span></div>
    </div>
    <div id="filter-area" class="fscroll"><div class="frow" id="frow"></div></div>
  </div>
  <div class="sbar">
    <span class="sdot loading" id="sdot"></span>
    <span id="stxt">Cargando datos en vivo...</span>

  <div class="page active" id="page-cal"><div class="empty">Cargando partidos...</div></div>
  <div class="page" id="page-grp"><div class="st-loading">Cargando posiciones...</div></div>

</div>

// ─── MATCH HELPERS (TheSportsDB) ───
// status values: "" / "NS"=not started, "1H","2H","HT","ET","FT","Match Finished","AET","PEN"
function getPhase(m){
  const ev=apiEvents[m.id];
  if(ev){
    const s=(ev.strStatus||"").toUpperCase();
    if(s==="HT")return"ht";
    if(["1H","2H","ET","P","LIVE","BT"].includes(s))return"live";
    if(["FT","AET","PEN","MATCH FINISHED","FINISHED"].includes(s)||s.includes("FINISH"))return"ft";
    if(s==="NS"||s==="NOT STARTED"){/* fall through to time check */}
  }
  const now=new Date(),dt=new Date(m.dt+"T"+m.tm+":00-06:00");
  if(now>new Date(dt.getTime()+2.5*3600000))return"ft";
  if(now>dt)return"live";
  return"sched";
}
function getScore(m){
  const ev=apiEvents[m.id];
  if(!ev)return null;
  const h=ev.intHomeScore,a=ev.intAwayScore;
  if(h===null||h===undefined||h===""||a===null||a===undefined||a==="")return null;
  return{home:parseInt(h),away:parseInt(a)};
}
function getElapsed(m){
  const ev=apiEvents[m.id];if(!ev)return null;
  const s=(ev.strStatus||"").toUpperCase();
  if(!["1H","2H","ET","P","LIVE","BT"].includes(s))return null;
  // TheSportsDB sometimes has strProgress with the minute
  if(ev.strProgress&&ev.strProgress!=="0")return ev.strProgress.replace(/'/g,"")+"'";
  return null;
}
function evIcon(tl,detail){
  const t=(tl||"").toLowerCase(),d=(detail||"").toLowerCase();
  if(t==="goal"){if(d.includes("own"))return"⚽🔴";if(d.includes("penalty"))return"⚽(P)";if(d.includes("missed"))return"❌";return"⚽";}
  if(t==="card"){if(d.includes("red"))return"🟥";if(d.includes("second"))return"🟥";return"🟨";}
  if(t==="subst"||t==="substitution")return"🔄";if(t==="var")return"📺";return"•";
}
function evLabel(ev){
  const tl=(ev.strTimeline||"").toLowerCase(),d=(ev.strTimelineDetail||"").toLowerCase();
  const pl=ev.strPlayer||"",as=ev.strAssist||"";
  if(tl==="goal"){
    if(d.includes("own"))return{main:`Autogol: ${pl}`,sub:""};
    if(d.includes("penalty"))return{main:`Penal: ${pl}`,sub:as?`Asist: ${as}`:""};
    if(d.includes("missed"))return{main:`Penal fallado: ${pl}`,sub:""};
    return{main:pl,sub:as?`Asist: ${as}`:""};
  }
  if(tl==="card"){
    if(d.includes("red"))return{main:`Tarjeta roja: ${pl}`,sub:ev.strComment&&ev.strComment!=="NULL"?ev.strComment:""};
    if(d.includes("second"))return{main:`Doble amarilla: ${pl}`,sub:""};
    return{main:`Tarjeta amarilla: ${pl}`,sub:ev.strComment&&ev.strComment!=="NULL"?ev.strComment:""};
  }
  if(tl==="subst"||tl==="substitution")return{main:`Cambio: ↑ ${pl}`,sub:as?`↓ ${as}`:""};
  return{main:pl||ev.strTimelineDetail||"",sub:""};
}
function toggleEv(id){
  openEv[id]=!openEv[id];
  if(openEv[id]&&!timelines[id]&&apiEvents[id]?.idEvent){loadTimeline(id,apiEvents[id].idEvent);}
  renderMatches();
}

// ─── RENDER CALENDAR ───
function renderMatches(){
  const list=document.getElementById("page-cal");
  let filtered=activeFilter==="ALL"?MS:MS.filter(m=>m.fe===activeFilter);
  filtered=[...filtered].sort((a,b)=>new Date(a.dt+"T"+a.tm)-new Date(b.dt+"T"+b.tm));
  if(!filtered.length){list.innerHTML=`<div class="empty">No hay partidos.</div>`;return;}
  let html="",lastDate="";
  filtered.forEach(m=>{
    if(m.dt!==lastDate){html+=`<div class="dlabel">${fmtDate(m.dt)}</div>`;lastDate=m.dt;}
    const phase=getPhase(m),score=getScore(m),elapsed=getElapsed(m);
    const hn=m.hname[lang],an=m.aname[lang];
    const bClass=phase==="live"?"b-live":phase==="ht"?"b-ht":phase==="ft"?"b-ft":"b-sched";
    let bLabel=phase==="live"?t("live"):phase==="ht"?t("ht"):phase==="ft"?t("ft"):`${t("grp")} ${m.gr}`;
    if(phase==="live"&&elapsed)bLabel+=` ${elapsed}`;
    const isLive=phase==="live"||phase==="ht";
    const tl=timelines[m.id]||[];
    const hasTimeline=apiEvents[m.id]?.idEvent;
    const showEv=openEv[m.id];
    const cardClass="mcard"+(isLive?" live":phase==="ft"?" ft":"");
    const scoreH=score!==null?`<span class="sn">${score.home}</span>`:`<span class="sn" style="color:var(--text4)">–</span>`;
    const scoreA=score!==null?`<span class="sn">${score.away}</span>`:`<span class="sn" style="color:var(--text4)">–</span>`;
    let evHTML="";
    if(showEv){
      evHTML=`<div class="epanel"><div class="ep-hdr"><i class="ti ti-timeline" aria-hidden="true" style="font-size:12px"></i> ${t("mmtitle")}</div>`;
      if(!tl.length){evHTML+=`<div class="noev">${t("noev")}</div>`;}
      else{[...tl].sort((a,b)=>(parseInt(a.intTime)||0)-(parseInt(b.intTime)||0)).forEach(ev=>{const min=ev.intTime||"?";const ico=evIcon(ev.strTimeline,ev.strTimelineDetail);const lbl=evLabel(ev);evHTML+=`<div class="evrow"><span class="evmin">${min}'</span><span class="evico">${ico}</span><span class="evtxt">${lbl.main}${lbl.sub?`<span class="evsub">${lbl.sub}</span>`:""}</span></div>`;});}
      evHTML+=`</div>`;
    }
    html+=`<div class="${cardClass}">
      <div class="ch"><div class="ch-time"><i class="ti ti-clock" aria-hidden="true" style="font-size:11px"></i>&nbsp;${m.tm} ${t("cdmx")}</div><div class="badge ${bClass}">${bLabel}</div></div>
      <div class="matchup">
        <div class="tcol home"><span class="tflag">${m.hf}</span><div class="tinfo"><div class="tname">${hn}</div><div class="tcode">${t("grp")} ${m.gr}</div></div></div>
        <div class="scenter"><div class="sbox">${scoreH}<span class="ssep">:</span>${scoreA}</div>${isLive&&elapsed?`<div class="smin">${elapsed}</div>`:""}</div>
        <div class="tcol away"><span class="tflag">${m.af}</span><div class="tinfo"><div class="tname">${an}</div><div class="tcode">${t("grp")} ${m.gr}</div></div></div>
      </div>
      <div class="cf"><div class="venue"><i class="ti ti-map-pin" aria-hidden="true" style="font-size:11px;flex-shrink:0"></i><span>${m.st} · ${m.ci}</span></div>
      <div class="cbtns">${(isLive||phase==="ft")&&hasTimeline?`<button class="cbtn${showEv?" on":""}" onclick="toggleEv('${m.id}')"><i class="ti ti-${showEv?"chevron-up":"list"}" aria-hidden="true" style="font-size:11px"></i>${showEv?t("hideEv"):t("showEv")}</button>`:""}</div></div>
      ${evHTML}</div>`;
  });
  list.innerHTML=html;
}

// ─── STANDINGS (computed from results) ───
function computeStandings(){
  const result={};
  FEATURED_GROUPS.forEach(g=>{
    const teams={};
    (GROUP_TEAMS[g]||[]).forEach(tm=>{teams[tm.code]={code:tm.code,flag:tm.flag,name:tm,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};});
    ALL_GROUP_MS.filter(m=>m.gr===g).forEach(m=>{
      const ev=apiEvents[m.id];
      if(!ev||ev.intHomeScore===null||ev.intHomeScore===""||ev.intHomeScore===undefined)return;
      const ph=(ev.strStatus||"").toUpperCase();
      if(!(["FT","AET","PEN","MATCH FINISHED","FINISHED"].includes(ph)||ph.includes("FINISH")))return;
      const gh=parseInt(ev.intHomeScore),ga=parseInt(ev.intAwayScore);
      const ht=teams[m.h],at=teams[m.a];
      if(ht){ht.pj++;ht.gf+=gh;ht.gc+=ga;if(gh>ga){ht.g++;ht.pts+=3;}else if(gh===ga){ht.e++;ht.pts++;}else ht.p++;}
      if(at){at.pj++;at.gf+=ga;at.gc+=gh;if(ga>gh){at.g++;at.pts+=3;}else if(ga===gh){at.e++;at.pts++;}else at.p++;}
    });
    result[g]=Object.values(teams).sort((a,b)=>{if(b.pts!==a.pts)return b.pts-a.pts;const gdA=a.gf-a.gc,gdB=b.gf-b.gc;if(gdB!==gdA)return gdB-gdA;return b.gf-a.gf;});
  });
  return result;
}
function renderStandings(){
  const page=document.getElementById("page-grp");
  const computed=computeStandings();
  let html="";
  FEATURED_GROUPS.forEach(g=>{
    const rows=computed[g]||[];const featCodes=new Set(FEAT);
    html+=`<div class="grp-block"><div class="grp-title"><span>${g}</span>${lang==="es"?"Grupo":"Group"} ${g}</div><div class="standing-table"><div class="st-head"><div></div><div></div><div>${t("p")}</div><div>${t("w")}</div><div>${t("d")}</div><div>${t("l")}</div><div>${t("pts")}</div></div>`;
    rows.forEach((row,i)=>{
      const isFeat=featCodes.has(row.code);const q=i<2?" qualify":i===2?" maybe":"";
      html+=`<div class="st-row${q}${isFeat?" featured":""}"><div class="st-pos">${i+1}</div><div class="st-team"><span class="st-flag">${row.flag}</span><span class="st-name">${row.name[lang]}</span></div><div class="st-num">${row.pj}</div><div class="st-num">${row.g}</div><div class="st-num">${row.e}</div><div class="st-num">${row.p}</div><div class="st-pts">${row.pts}</div></div>`;
    });
    html+=`</div></div>`;
  });
  page.innerHTML=html||`<div class="empty">Sin datos.</div>`;
}

function renderKnockout(){
  const page=document.getElementById("page-ko");
  if(!koData.length){
    page.innerHTML=`<div style="padding:20px 4px">
      <div class="ko-round-title">${t("r32")}</div>${[...Array(8)].map((_,i)=>koTBD()).join("")}
      <div class="ko-round-title" style="margin-top:8px">${t("r16")}</div>${[...Array(4)].map((_,i)=>koTBD()).join("")}
      <div class="ko-round-title" style="margin-top:8px">${t("sf")}</div>${[...Array(2)].map((_,i)=>koTBD()).join("")}
      <div class="ko-round-title" style="margin-top:8px">${t("final")}</div>${koTBD()}
    </div>`;
    return;
  }
  const rounds=[
    {key:"r32",f:koData.filter(e=>(e.strRound||"").includes("32")||(e.intRound==="1"))},
    {key:"r16",f:koData.filter(e=>/quarter|cuartos/i.test(e.strRound||""))},
    {key:"sf",f:koData.filter(e=>/semi/i.test(e.strRound||""))},
    {key:"final",f:koData.filter(e=>/^final|gran final/i.test(e.strRound||"")&&!/semi|quarter/i.test(e.strRound||""))}
  ];
  let html=`<div style="padding:4px 0">`;
  rounds.forEach(r=>{if(!r.f.length)return;html+=`<div class="ko-round-title">${t(r.key)}</div>`;r.f.forEach(ev=>{html+=koCard(ev);});});
  html+=`</div>`;
  page.innerHTML=html||`<div class="empty">${t("tbd")}</div>`;
}
function koTBD(){return`<div class="ko-card tbd"><div class="ko-matchup"><div class="ko-team home"><span class="ko-flag">🏳️</span><span class="ko-name" style="color:var(--text4)">${t("tbd")}</span></div><div class="ko-sbox"><span class="ko-sn" style="color:var(--text4)">–</span><span class="ko-sep">:</span><span class="ko-sn" style="color:var(--text4)">–</span></div><div class="ko-team away"><span class="ko-flag">🏳️</span><span class="ko-name" style="color:var(--text4)">${t("tbd")}</span></div></div></div>`;}
function koCard(ev){
  const s=(ev.strStatus||"").toUpperCase();
  const isLive=["1H","2H","ET","P","LIVE","HT","BT"].includes(s);
  const isFt=["FT","AET","PEN","MATCH FINISHED"].includes(s)||s.includes("FINISH");
  const hn=ev.strHomeTeam||t("tbd"),an=ev.strAwayTeam||t("tbd");
  const gh=ev.intHomeScore,ga=ev.intAwayScore;
  let badge="";
  if(isLive)badge=`<span class="badge b-live">${t("live")}</span>`;
  else if(isFt)badge=`<span class="badge b-ft">${t("ft")}</span>`;
  else if(ev.dateEvent)badge=`<span style="font-size:10px;color:var(--text4)">${new Date(ev.dateEvent+"T12:00").toLocaleDateString(lang==="es"?"es-MX":"en-US",{month:"short",day:"numeric"})}</span>`;
  const sH=gh!==null&&gh!==undefined&&gh!==""?`<span class="ko-sn">${gh}</span>`:`<span class="ko-sn" style="color:var(--text4)">–</span>`;
  const sA=ga!==null&&ga!==undefined&&ga!==""?`<span class="ko-sn">${ga}</span>`:`<span class="ko-sn" style="color:var(--text4)">–</span>`;
  return`<div class="ko-card${isLive?" live":""}${isFt?" ft":""}"><div class="ko-meta">${badge}</div><div class="ko-matchup"><div class="ko-team home"><span class="ko-flag">⚽</span><span class="ko-name">${hn}</span></div><div class="ko-sbox">${sH}<span class="ko-sep">:</span>${sA}</div><div class="ko-team away"><span class="ko-flag">⚽</span><span class="ko-name">${an}</span></div></div>${ev.strVenue?`<div class="ko-venue"><i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>${ev.strVenue}</div>`:""}</div>`;
}

// ─── API (TheSportsDB) ───
async function tsdb(path){
  const r=await fetch(`${TSDB_BASE}/${TSDB_KEY}/${path}`);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
// match an API event to our local match by date + teams
function matchEvent(apiEv){
  const d=apiEv.dateEvent;
  const h=(apiEv.strHomeTeam||"").toLowerCase();
  const a=(apiEv.strAwayTeam||"").toLowerCase();
  return MS.find(m=>m.dt===d&&(
    (m.apiH.toLowerCase()===h&&m.apiA.toLowerCase()===a)||
    (h.includes(m.apiH.toLowerCase())&&a.includes(m.apiA.toLowerCase()))
  ));
}
async function loadSeason(){
  const data=await tsdb(`eventsseason.php?id=${WC_LEAGUE_ID}&s=${WC_SEASON}`);
  const events=data?.events||[];
  // store knockout events separately
  koData=[];
  events.forEach(ev=>{
    const local=matchEvent(ev);
    if(local){apiEvents[local.id]=ev;}
    const round=(ev.strRound||"").toLowerCase();
    if(/32|16|quarter|semi|final|cuartos/.test(round)&&!/group|grupo/.test(round)){koData.push(ev);}
  });
}
async function loadTimeline(localId,eventId){
  try{
    const data=await tsdb(`lookuptimeline.php?id=${eventId}`);
    timelines[localId]=data?.timeline||[];
    renderMatches();
  }catch(e){timelines[localId]=[];}
}
// Refresh timelines for currently-open live matches
async function refreshOpenTimelines(){
  const ids=Object.keys(openEv).filter(id=>openEv[id]&&apiEvents[id]?.idEvent);
  for(const id of ids){await loadTimeline(id,apiEvents[id].idEvent);}
}
async function loadAll(){
  const dot=document.getElementById("sdot"),stxt=document.getElementById("stxt");
  dot.className="sdot loading";stxt.textContent=t("loading");
  try{
    await loadSeason();
    dot.className="sdot ok";
    stxt.textContent=`${t("updated")} · ${new Date().toLocaleTimeString(lang==="es"?"es-MX":"en-US",{hour:"2-digit",minute:"2-digit"})}`;
  }catch(e){
    dot.className="sdot err";stxt.textContent=t("error");
  }
  renderMatches();renderStandings();renderKnockout();
}

// ─── INIT ───
switchTab("cal");
renderFilters();renderMatches();
loadAll();
// refresh scores + open timelines every 45s
setInterval(()=>{loadSeason().then(()=>{renderMatches();renderStandings();renderKnockout();refreshOpenTimelines();}).catch(()=>{});},45000);
</script>
