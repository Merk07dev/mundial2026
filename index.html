<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --deep:#07090f;--surf:#0f1520;--card:#131c2b;--card2:#172035;
  --gold:#f0b429;--gold2:#ffd770;
  --blue:#3b82f6;--blue2:#60a5fa;--blue3:#1d4ed8;
  --red:#ef4444;--red2:#fca5a5;
  --green:#22c55e;--green2:#86efac;
  --amber:#f59e0b;--amber2:#fcd34d;
  --text:#f1f5f9;--text2:#cbd5e1;--text3:#94a3b8;--text4:#64748b;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.16);
  --r:10px;--rl:16px;--rxl:22px
}
html{background:var(--deep)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--deep);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--deep);position:relative}

/* HEADER */
.hdr{background:linear-gradient(160deg,#0d1526 0%,#12173a 60%,#0d1526 100%);padding:20px 16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.hdr::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,0.3),transparent);margin-top:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
.brand-text .name{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.brand-text .sub{font-size:11px;color:var(--text4);margin-top:1px}
.lang-btn{font-size:11px;font-weight:600;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,0.05);color:var(--text3);border:1px solid var(--border2);cursor:pointer;transition:all .15s}
.lang-btn:hover{background:rgba(255,255,255,0.08);color:var(--text2)}

.fscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 12px}
.fscroll::-webkit-scrollbar{display:none}
.frow{display:flex;gap:7px;width:max-content}
.fpill{font-size:11px;font-weight:500;padding:6px 13px;border-radius:20px;background:rgba(255,255,255,0.04);color:var(--text3);border:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fpill:hover{background:rgba(255,255,255,0.07);color:var(--text2)}
.fpill.active{background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(59,130,246,0.35)}

/* STATUS BAR */
.sbar{display:flex;align-items:center;gap:7px;padding:7px 16px;background:rgba(0,0,0,0.3);font-size:11px;color:var(--text4);border-bottom:1px solid var(--border)}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sdot.ok{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.5)}
.sdot.loading{background:var(--amber);animation:blink 1s infinite}
.sdot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* CONTENT */
.content{padding:12px 12px 32px}
.dlabel{font-size:11px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.07em;padding:16px 4px 6px}
.dlabel:first-child{padding-top:8px}

/* MATCH CARD */
.mcard{border-radius:var(--rl);overflow:hidden;background:var(--card);border:1px solid var(--border);margin-bottom:9px;position:relative;transition:border-color .2s}
.mcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 10%,rgba(255,255,255,0.09) 50%,transparent 90%);pointer-events:none}
.mcard.live{border-color:rgba(239,68,68,0.25);background:linear-gradient(160deg,#130d0d 0%,#1c1010 100%)}
.mcard.live::before{background:linear-gradient(90deg,transparent 10%,rgba(239,68,68,0.2) 50%,transparent 90%)}
.mcard.ft{opacity:.85}

/* CARD HEADER */
.ch{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0}
.ch-time{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text4)}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.b-sched{background:rgba(59,130,246,0.1);color:var(--blue2);border:1px solid rgba(59,130,246,0.18)}
.b-live{background:rgba(239,68,68,0.12);color:var(--red2);border:1px solid rgba(239,68,68,0.22);animation:blink 1.8s infinite}
.b-ht{background:rgba(245,158,11,0.1);color:var(--amber2);border:1px solid rgba(245,158,11,0.2)}
.b-ft{background:rgba(34,197,94,0.08);color:var(--green2);border:1px solid rgba(34,197,94,0.18)}

/* MATCHUP */
.matchup{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 14px 12px}
.tcol{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tcol.away{flex-direction:row-reverse}
.tflag{font-size:28px;line-height:1;flex-shrink:0}
.tinfo{min-width:0}
.tname{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcode{font-size:10px;color:var(--text4);margin-top:2px}
.tcol.away .tinfo{text-align:right}
.tcol.away .tcode{text-align:right}

.scenter{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.sbox{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:var(--r);padding:7px 14px}
.sn{font-size:28px;font-weight:700;color:var(--text);min-width:22px;text-align:center;line-height:1}
.ssep{font-size:15px;color:var(--text4);margin:0 2px}
.smin{font-size:10px;font-weight:700;color:var(--red2);margin-top:4px;letter-spacing:.03em}

/* FOOTER */
.cf{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 10px;border-top:1px solid var(--border)}
.venue{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text4);flex:1;min-width:0}
.venue span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtns{display:flex;gap:5px;flex-shrink:0}
.cbtn{font-size:10px;font-weight:500;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text3);border:1px solid var(--border2);cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .15s;white-space:nowrap}
.cbtn:hover{background:rgba(255,255,255,0.08);color:var(--text2)}
.cbtn.on{background:rgba(59,130,246,0.12);color:var(--blue2);border-color:rgba(59,130,246,0.22)}

/* EVENTS PANEL */
.epanel{background:rgba(0,0,0,0.3);border-top:1px solid var(--border)}
.ep-hdr{display:flex;align-items:center;gap:6px;padding:8px 14px 4px;font-size:11px;font-weight:600;color:var(--text3)}
.evrow{display:flex;align-items:flex-start;gap:8px;padding:4px 14px;font-size:12px}
.evrow:last-child{padding-bottom:10px}
.evmin{font-size:10px;font-weight:700;color:var(--text4);min-width:28px;text-align:right;padding-top:2px;flex-shrink:0}
.evico{font-size:14px;flex-shrink:0;line-height:1.4}
.evtxt{color:var(--text2);flex:1;line-height:1.4}
.evsub{font-size:10px;color:var(--text4);display:block;margin-top:1px}
.noev{font-size:12px;color:var(--text4);font-style:italic;padding:6px 14px 10px}

/* EDIT FORM */


.empty{text-align:center;padding:4rem 1rem;color:var(--text4);font-size:14px}
.footer{padding:1rem;text-align:center;font-size:11px;color:var(--text4);border-top:1px solid var(--border)}
</style>
</head>

function t(k){return T[k]?.[lang]||k}

let lang="es",activeFilter="ALL",apiData={},openEv={};

function toggleLang(){
  lang=lang==="es"?"en":"es";
  document.getElementById("ltoggle").textContent=lang==="es"?"EN":"ES";
  document.getElementById("app-title").textContent=t("title");
  document.getElementById("ftxt").textContent=lang==="es"
    ?"Mundial 2026 · API-Football · Horarios en hora CDMX"
    :"World Cup 2026 · API-Football · Times in CDMX timezone";
  renderFilters();renderMatches();
}

function fmtDate(ds){
  return new Date(ds+"T12:00:00").toLocaleDateString(lang==="es"?"es-MX":"en-US",{weekday:"long",day:"numeric",month:"long"});
}

function renderFilters(){
  const row=document.getElementById("frow");
  const filters=[{code:"ALL",label:t("all"),flag:""},...FEAT.map(k=>({code:k,label:TEAMS[k][lang],flag:TEAMS[k].flag}))];
  row.innerHTML=filters.map(f=>`<button class="fpill${activeFilter===f.code?" active":""}" onclick="setFilter('${f.code}')">${f.flag?f.flag+" ":""}${f.label}</button>`).join("");
}
function setFilter(c){activeFilter=c;renderFilters();renderMatches();}

function getPhase(m){
  const d=apiData[m.id];
  if(d){
    const s=d.fixture?.status?.short||"";
    if(s==="HT")return"ht";
    if(["1H","2H","ET","P","BT","INT","LIVE"].includes(s))return"live";
    if(["FT","AET","PEN"].includes(s))return"ft";
  }
  const now=new Date(),dt=new Date(m.dt+"T"+m.tm+":00-06:00");
  if(now>new Date(dt.getTime()+2.5*3600000))return"ft";
  if(now>dt)return"live";
  return"sched";
}
function getScore(m){
  const d=apiData[m.id];
  if(d&&d.goals&&d.goals.home!==null&&d.goals.home!==undefined)return{home:d.goals.home,away:d.goals.away};
  return null;
}
function getElapsed(m){
  const d=apiData[m.id];if(!d)return null;
  const s=d.fixture?.status?.short||"";
  if(!["1H","2H","ET","HT","P","BT","INT","LIVE"].includes(s))return null;
  const e=d.fixture?.status?.elapsed;
  const x=d.fixture?.status?.extra;
  return e?(x?`${e}+${x}'`:`${e}'`):null;
}
function evIcon(type,detail){
  const tp=(type||"").toLowerCase(),dt=(detail||"").toLowerCase();
  if(tp==="goal"){
    if(dt.includes("own"))return"⚽🔴";
    if(dt.includes("pen")&&!dt.includes("missed"))return"⚽(P)";
    if(dt.includes("missed"))return"❌";
    if(dt.includes("var"))return"📺⚽";
    return"⚽";
  }
  if(tp==="card"){if(dt.includes("red"))return"🟥";if(dt.includes("var"))return"📺🟨";return"🟨";}
  if(tp==="subst")return"🔄";
  if(tp==="var")return"📺";
  return"•";
}
function evLabel(ev){
  const tp=(ev.type||"").toLowerCase(),dt=(ev.detail||"").toLowerCase();
  const pl=ev.player?.name||ev.player||"",as=ev.assist?.name||ev.assist||"";
  if(tp==="goal"){
    if(dt.includes("own"))return{main:`Autogol: ${pl}`,sub:""};
    if(dt.includes("pen")&&!dt.includes("missed"))return{main:`Penal: ${pl}`,sub:as?`Asist: ${as}`:""};
    if(dt.includes("missed"))return{main:`Penal fallado: ${pl}`,sub:""};
    return{main:pl,sub:as?`Asist: ${as}`:""};
  }
  if(tp==="card"){
    if(dt.includes("red"))return{main:`Tarjeta roja: ${pl}`,sub:""};
    return{main:`Tarjeta amarilla: ${pl}`,sub:""};
  }
  if(tp==="subst"){
    const off=ev.assist?.name||ev.assist||"";
    return{main:`Cambio: ↑ ${pl}`,sub:off?`↓ ${off}`:""};
  }
  return{main:pl||ev.detail||"",sub:""};
}

function toggleEv(id){openEv[id]=!openEv[id];renderMatches();}

function renderMatches(){
  const list=document.getElementById("mlist");
  let filtered=activeFilter==="ALL"?MS:MS.filter(m=>m.fe===activeFilter);
  filtered=[...filtered].sort((a,b)=>new Date(a.dt+"T"+a.tm)-new Date(b.dt+"T"+b.tm));
  if(!filtered.length){list.innerHTML=`<div class="empty">No hay partidos.</div>`;return;}

  let html="",lastDate="";
  filtered.forEach(m=>{
    if(m.dt!==lastDate){html+=`<div class="dlabel">${fmtDate(m.dt)}</div>`;lastDate=m.dt;}
    const phase=getPhase(m),score=getScore(m),elapsed=getElapsed(m);
    const hn=m.hname[lang],an=m.aname[lang];
    const bClass=phase==="live"?"b-live":phase==="ht"?"b-ht":phase==="ft"?"b-ft":"b-sched";
    let bLabel=phase==="live"?t("live"):phase==="ht"?t("ht"):phase==="ft"?t("ft"):`${t("grp")} ${m.gr}`;
    if(phase==="live"&&elapsed)bLabel+=` ${elapsed}`;
    const isLive=phase==="live"||phase==="ht";
    const evs=apiData[m.id]?.events||[];
    const showEv=openEv[m.id];
    const cardClass="mcard"+(isLive?" live":phase==="ft"?" ft":"");
    const scoreH=score!==null?`<span class="sn">${score.home}</span>`:`<span class="sn" style="color:var(--text4)">–</span>`;
    const scoreA=score!==null?`<span class="sn">${score.away}</span>`:`<span class="sn" style="color:var(--text4)">–</span>`;

    let evHTML="";
    if(showEv){
      evHTML=`<div class="epanel"><div class="ep-hdr"><i class="ti ti-timeline" aria-hidden="true" style="font-size:12px"></i>${t("mmtitle")}</div>`;
      if(!evs.length){evHTML+=`<div class="noev">${t("noev")}</div>`;}
      else{
        [...evs].sort((a,b)=>(a.time?.elapsed||0)-(b.time?.elapsed||0)).forEach(ev=>{
          const min=ev.time?.elapsed||"?";
          const extra=ev.time?.extra?`+${ev.time.extra}`:"";
          const ico=evIcon(ev.type,ev.detail);
          const lbl=evLabel(ev);
          evHTML+=`<div class="evrow"><span class="evmin">${min}${extra}'</span><span class="evico">${ico}</span><span class="evtxt">${lbl.main}${lbl.sub?`<span class="evsub">${lbl.sub}</span>`:""}</span></div>`;
        });
      }
      evHTML+=`</div>`;
    }

    html+=`<div class="${cardClass}">
      <div class="ch">
        <div class="ch-time"><i class="ti ti-clock" aria-hidden="true" style="font-size:11px"></i>&nbsp;${m.tm} ${t("cdmx")}</div>
        <div class="badge ${bClass}">${bLabel}</div>
      </div>
      <div class="matchup">
        <div class="tcol home">
          <span class="tflag">${m.hf}</span>
          <div class="tinfo"><div class="tname">${hn}</div><div class="tcode">Grupo ${m.gr}</div></div>
        </div>
        <div class="scenter">
          <div class="sbox">${scoreH}<span class="ssep">:</span>${scoreA}</div>
          ${isLive&&elapsed?`<div class="smin">${elapsed}</div>`:""}
        </div>
        <div class="tcol away">
          <span class="tflag">${m.af}</span>
          <div class="tinfo"><div class="tname">${an}</div><div class="tcode">Grupo ${m.gr}</div></div>
        </div>
      </div>
      <div class="cf">
        <div class="venue"><i class="ti ti-map-pin" aria-hidden="true" style="font-size:11px;flex-shrink:0"></i><span>${m.st} · ${m.ci}</span></div>
        <div class="cbtns">
          ${isLive||evs.length?`<button class="cbtn${showEv?" on":""}" onclick="toggleEv('${m.id}')"><i class="ti ti-${showEv?"chevron-up":"list"}" aria-hidden="true" style="font-size:11px"></i>${showEv?t("hideEv"):t("showEv")}</button>`:""}
        </div>
      </div>
      ${evHTML}
    </div>`;
  });
  list.innerHTML=html;
}

async function apiFetch(path){
  const r=await fetch(`${BASE}${path}`,{headers:{"x-apisports-key":KEY}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
async function loadTeam(code){
  const id=TEAMS[code]?.id;if(!id)return;
  const data=await apiFetch(`/fixtures?league=1&season=2026&team=${id}`);
  const fixes=data?.response||[];
  const local=MS.filter(m=>m.fe===code);
  fixes.forEach(fix=>{
    const fd=fix.fixture?.date?.slice(0,10);
    const lm=local.find(m=>m.dt===fd);
    if(lm)apiData[lm.id]=fix;
  });
}
async function loadLive(){
  const data=await apiFetch(`/fixtures?league=1&season=2026&live=all`);
  const fixes=data?.response||[];
  fixes.forEach(fix=>{
    const fd=fix.fixture?.date?.slice(0,10);
    const hn=(fix.teams?.home?.name||"").toLowerCase();
    const an=(fix.teams?.away?.name||"").toLowerCase();
    const lm=MS.find(m=>m.dt===fd&&(
      hn.includes(m.h.toLowerCase())||an.includes(m.a.toLowerCase())||
      m.h.toLowerCase().includes(hn.split(" ")[0])||m.a.toLowerCase().includes(an.split(" ")[0])
    ));
    if(lm)apiData[lm.id]=fix;
  });
}
async function loadAll(){
  const dot=document.getElementById("sdot"),stxt=document.getElementById("stxt");
  dot.className="sdot loading";stxt.textContent=t("loading");
  try{
    await Promise.allSettled(FEAT.map(c=>loadTeam(c)));
    try{await loadLive();}catch(e){}
    dot.className="sdot ok";
    stxt.textContent=`${t("updated")} · ${new Date().toLocaleTimeString(lang==="es"?"es-MX":"en-US",{hour:"2-digit",minute:"2-digit"})}`;
  }catch(e){
    dot.className="sdot err";
    stxt.textContent=t("error");
  }
  renderMatches();
}

renderFilters();renderMatches();loadAll();
setInterval(()=>{loadLive().then(()=>renderMatches()).catch(()=>{});},45000);
setInterval(()=>loadAll(),5*60*1000);
</script>
